<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Meu Treino Pro 💪</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="manifest" id="pwaManifest"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Meu Treino"/>
<link rel="apple-touch-icon" id="appleIcon"/>
<script>
(function(){
  const icon="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230d0d0d'/><text x='256' y='340' font-size='280' text-anchor='middle'>&#128170;</text><rect x='60' y='400' width='392' height='28' rx='14' fill='%23b5f23a'/></svg>");
  document.getElementById('appleIcon').href=icon;
  const manifest={name:"Meu Treino",short_name:"Treino",start_url:"./",display:"fullscreen",background_color:"#0d0d0d",theme_color:"#0d0d0d",orientation:"portrait",id:"/treino/",icons:[{src:icon,sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  if(location.hostname!=='localhost'&&location.protocol!=='file:'){document.getElementById('pwaManifest').href='./manifest.json';}
  else{document.getElementById('pwaManifest').href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));}
  if('serviceWorker' in navigator){
    const swUrl=(location.hostname==='localhost'||location.protocol==='file:')?URL.createObjectURL(new Blob([`self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',()=>self.clients.claim());`],{type:'text/javascript'})):'./sw.js';
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
})();
</script>
</head>
<body>
<style>
:root{
  --bg:#0d0d0d;--surface:#161616;--card:#1c1c1c;--card2:#222;
  --border:#2a2a2a;--border2:#333;
  --accent:#b5f23a;--accent-dim:#8fbe29;--accent-bg:rgba(181,242,58,.08);--accent-bg2:rgba(181,242,58,.15);
  --text:#f0f0f0;--text2:#aaa;--text3:#666;--text-done:#3a3a3a;
  --red:#ff4d4d;--blue:#4da6ff;--orange:#ffaa33;--purple:#c084fc;--teal:#34d399;--pink:#f472b6;
  --nav:64px;--r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;position:fixed;width:100%;top:0;left:0}
#app{display:none;flex-direction:column;height:100%;height:100dvh}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ── LOADING & LOGIN ── */
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200}
.loader{width:44px;height:44px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loginScreen{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);letter-spacing:1px;margin-bottom:36px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login-card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--text);text-align:center}
.login-err{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);border-radius:var(--rs);padding:10px 12px;font-size:13px;color:var(--red);display:none;text-align:center}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:44px}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px}

/* ── NAV ── */
.bot-nav{flex-shrink:0;height:var(--nav);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:color .2s;padding:6px 0 4px}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:19px;line-height:1}

/* ── COMMON ── */
.page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px 12px;flex-shrink:0}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--accent);line-height:1}
.page-sub{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.5px}
.pad{padding:14px 14px 110px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col{display:flex;flex-direction:column;gap:4px}
.section-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.tag-green{background:var(--accent-bg);color:var(--accent)}
.tag-blue{background:rgba(77,166,255,.1);color:var(--blue)}
.tag-orange{background:rgba(255,170,51,.1);color:var(--orange)}
.tag-purple{background:rgba(192,132,252,.1);color:var(--purple)}
.tag-red{background:rgba(255,77,77,.1);color:var(--red)}
.tag-teal{background:rgba(52,211,153,.1);color:var(--teal)}
.tag-pink{background:rgba(244,114,182,.1);color:var(--pink)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--rs);padding:10px 18px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-accent{background:var(--accent);color:#000}.btn-accent:active{background:var(--accent-dim)}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text2)}.btn-ghost:active{background:var(--border)}
.btn-danger{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);color:var(--red)}
.btn-blue{background:rgba(77,166,255,.1);border:1px solid rgba(77,166,255,.3);color:var(--blue)}
.btn-green{background:rgba(181,242,58,.1);border:1px solid rgba(181,242,58,.3);color:var(--accent)}
.btn-purple{background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.3);color:var(--purple)}
.btn-full{width:100%}.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}

/* ── INPUTS ── */
.input-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.input-label{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.input{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
select.input{appearance:none;-webkit-appearance:none}
textarea.input{resize:none;min-height:70px;font-size:13px}

/* ── STEPPER ── */
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;height:38px}
.step-btn{width:38px;height:38px;background:none;border:none;color:var(--accent);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
.step-btn:active{background:rgba(255,255,255,.04)}
.step-val{flex:1;text-align:center;font-size:15px;font-weight:700;user-select:none}
.weight-wrap{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);height:38px;padding:0 10px;gap:4px}
.weight-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;min-width:0}
.weight-input::placeholder{color:var(--text3);font-weight:400}
.weight-unit{font-size:12px;color:var(--text3);flex-shrink:0;font-weight:500}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:90;display:none;backdrop-filter:blur(4px)}
.overlay.show{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;z-index:91;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--border);max-height:94vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modal.show{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:4px;margin:10px auto 0}
.modal-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--accent)}
.modal-body{overflow-y:auto;padding:14px;flex:1;scrollbar-width:none}
.modal-body::-webkit-scrollbar{display:none}
.modal-footer{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px}
.cal-nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;color:var(--text3);font-weight:700;padding-bottom:6px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;font-weight:600;position:relative;transition:all .2s;cursor:pointer;padding:2px 0}
.cal-day:active{background:var(--border)!important}
.cal-day.today{border:2px solid var(--accent);color:var(--accent)}
.cal-day.trained{background:var(--accent-bg2);color:var(--accent);font-weight:800}
.cal-day.trained.today{border-color:var(--accent)}
.cal-day.missed{color:var(--text3)}
.cal-day.future{color:var(--text3)}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:1px;flex-shrink:0}
.cal-dot.dot-green{background:var(--accent)}
.cal-dot.dot-orange{background:var(--orange)}
.cal-dot.dot-red{background:var(--red);opacity:.5}
.cal-dot.dot-blue{background:var(--blue)}
.cal-dots{display:flex;gap:3px;margin-top:1px;align-items:center;justify-content:center}
.cal-dots .cal-dot{margin-top:0}
@keyframes slideL{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideR{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}

/* ── SUMMARY ── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.sum-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);line-height:1}
.sum-lbl{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.5px;text-transform:uppercase}

/* ── DAY TABS ── */
.days-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px 12px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.days-bar::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:7px 10px;border-radius:var(--rs);border:1.5px solid var(--border);background:none;cursor:pointer;transition:all .2s;min-width:48px}
.day-btn .da{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--text3);transition:color .2s}
.day-btn .dp{font-size:10px;color:var(--text3);margin-top:1px}
.day-btn.active{border-color:var(--accent);background:var(--accent-bg)}
.day-btn.active .da,.day-btn.active .dp{color:var(--accent)}
.day-btn.has-done .da{color:var(--text)}

/* ── PROGRESS ── */
.prog-bar-wrap{background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;flex-shrink:0}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-label{font-size:11px;color:var(--text3)}
.prog-pct{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent)}
.prog-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}

/* ── EXERCISE CARD ── */
.ex-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;position:relative;overflow:hidden;transition:all .3s}
.ex-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--accent);opacity:0;transition:opacity .3s}
.ex-card.done{background:#141a10;border-color:#222}.ex-card.done::before{opacity:1}
.ex-card.cardio-t::before{background:var(--orange)}
.ex-card.abs-t::before{background:var(--blue)}
.ex-card.extra-t::before{background:var(--purple)}
.ex-name{font-weight:700;font-size:15px;line-height:1.2;transition:all .3s}
.ex-card.done .ex-name{text-decoration:line-through;color:var(--text-done)}
.ex-ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.ctrl-lbl{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.check-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .25s}
.check-btn svg{width:14px;height:14px;stroke:transparent;transition:stroke .25s}
.check-btn.checked{border-color:var(--accent);background:var(--accent)}
.check-btn.checked svg{stroke:#000}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--border)}

/* ── TECHNIQUE BADGE ── */
.tech-badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;margin-top:3px}
.tech-RIS{background:rgba(244,114,182,.15);color:var(--pink)}
.tech-DROP{background:rgba(255,170,51,.15);color:var(--orange)}
.tech-REST{background:rgba(77,166,255,.15);color:var(--blue)}
.tech-UP{background:rgba(52,211,153,.15);color:var(--teal)}

/* ── TOGGLE GROUP ── */
.tgl-group{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
.tgl-btn{flex:1;padding:9px 6px;background:none;border:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap;min-width:fit-content;transition:all .2s}
.tgl-btn.active{background:var(--accent-bg2);color:var(--accent)}

/* ── LIST ITEMS ── */
.list-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:7px;cursor:pointer;transition:all .2s}
.list-item:active{background:var(--card2)}.list-item.inactive{opacity:.45}.list-item.selected{border-color:var(--accent);background:var(--accent-bg)}
.li-info{flex:1;min-width:0}.li-name{font-weight:600;font-size:14px}.li-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* ── SWITCHES ── */
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch-track{position:absolute;inset:0;background:var(--border2);border-radius:24px;cursor:pointer;transition:background .3s}
.switch-track::after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .3s}
.switch input:checked+.switch-track{background:var(--accent)}
.switch input:checked+.switch-track::after{transform:translateX(20px)}

/* ── CHECKBOXES ── */
.chk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all .2s}
.chk-item.selected{border-color:var(--accent);background:var(--accent-bg)}
.chk-box{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:13px;font-weight:700}
.chk-item.selected .chk-box{background:var(--accent);border-color:var(--accent);color:#000}

/* ── IMC BAR ── */
.imc-bar{height:8px;border-radius:8px;background:linear-gradient(90deg,#4da6ff 0%,#b5f23a 30%,#ffaa33 65%,#ff4d4d 100%);margin:8px 0;position:relative}
.imc-needle{position:absolute;top:-5px;width:4px;height:18px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .5s}

/* ── CHART ── */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chart-svg{width:100%;overflow:visible}
.hist-table{width:100%;border-collapse:collapse;margin-top:8px}
.hist-table th{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;text-align:left;padding:0 0 8px;border-bottom:1px solid var(--border)}
.hist-table td{font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}

/* ── PLAN CARD ── */
.plan-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;position:relative}
.plan-card.active-plan{border-color:var(--accent)}
.plan-card.active-plan::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:var(--accent)}
.plan-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;line-height:1;margin-bottom:4px}
.plan-meta{font-size:11px;color:var(--text3);margin-top:2px}
.plan-days-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.plan-day-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--text2)}
.plan-day-pill.active-day{background:var(--accent-bg2);border-color:var(--accent);color:var(--accent)}

/* ── ARTICLE CARD ── */
.article-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.article-header{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.article-icon{font-size:28px;flex-shrink:0}
.article-title{font-weight:700;font-size:14px;line-height:1.3}
.article-sub{font-size:11px;color:var(--text3);margin-top:2px}
.article-body{padding:0 14px 14px;font-size:13px;color:var(--text2);line-height:1.7;display:none}
.article-body.open{display:block}
.article-body h4{color:var(--accent);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.article-body p{margin-bottom:8px}
.article-body ul{padding-left:16px;margin-bottom:8px}
.article-body li{margin-bottom:4px}
.tech-compare{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.tech-compare th{background:var(--surface);padding:8px;text-align:left;font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border)}
.tech-compare td{padding:8px;border-bottom:1px solid var(--border)}
.tech-compare tr:last-child td{border-bottom:none}

/* ── MEASURE GRID ── */
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.measure-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px}
.measure-lbl{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.measure-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);line-height:1}
.measure-diff{font-size:10px;margin-top:2px}

/* ── SYNC DOT ── */
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:5px;transition:background .3s}
.sync-dot.syncing{background:var(--orange);animation:pulse 1s infinite}
.sync-dot.synced{background:var(--accent)}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── PROFILE AVATAR ── */
.profile-avatar-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;gap:8px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--accent-bg2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;overflow:hidden;transition:all .2s}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit-hint{font-size:11px;color:var(--text3);letter-spacing:.5px}

@keyframes sIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:sIn .2s ease both}
</style>

function getActivePlan(){
  if(!S.plans||!S.plans.length) return null;
  if(S.activePlanId){
    const p=S.plans.find(p=>p.id===S.activePlanId);
    if(p&&p.active) return p;
  }
  return S.plans.find(p=>p.active)||null;
}

function getPlanDayExs(plan, dow){
  if(!plan) return [];
  return (plan.days&&plan.days[dow])||[];
}

function localDateStr(d){
  const dd=d||new Date();
  return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
}
function todayStr(){ return localDateStr(); }
function dateForDow(dow){
  const today=new Date(), diff=dow-today.getDay();
  const d=new Date(today); d.setDate(d.getDate()+diff);
  return localDateStr(d);
}

function getSession(dow, dateStr){

  const ds=dateStr||dateForDow(dow);
  if(!S.dailyLogs[ds]) S.dailyLogs[ds]={trained:false};
  const log=S.dailyLogs[ds];
  if(!log.session){
    log.session=tmpl.map(t=>({exId:t.exId,sets:t.sets,reps:t.reps,weight:t.weight||'',time:t.time||'',done:false,obs:t.obs||''}));
  } else if(log.session.length!==tmpl.length || log.session.some((x,i)=>!tmpl[i]||x.exId!==tmpl[i].exId)){
    log.session=tmpl.map(t=>{
      const ex=log.session.find(e=>e.exId===t.exId);
      return ex?{...ex}:{exId:t.exId,sets:t.sets,reps:t.reps,weight:t.weight||'',time:t.time||'',done:false,obs:t.obs||''};
    });
  }
  return log.session;
}

function exDB(id){ return S.exerciseDB[id]||{name:id,group:'peito',muscle:'',active:true}; }

function recordHistory(exId,item){
  const w=parseFloat(item.weight); if(!w) return;
  if(!S.history[exId]) S.history[exId]=[];
  const today=todayStr();
  const i=S.history[exId].findIndex(h=>h.date===today);
  const entry={date:today,weight:item.weight,sets:item.sets,reps:item.reps};
  if(i>=0) S.history[exId][i]=entry; else S.history[exId].push(entry);
  S.history[exId].sort((a,b)=>a.date.localeCompare(b.date));
}

function loadState(){
  try{ S=JSON.parse(localStorage.getItem('meuTreinoPro')||'{}'); }catch(e){ S={}; }
  const def=defaultState();
  if(!S.profile) S.profile=def.profile;
  if(!S.exerciseDB){ S.exerciseDB=def.exerciseDB; }
  else{ Object.keys(DEFAULT_DB).forEach(k=>{ if(!S.exerciseDB[k]) S.exerciseDB[k]=JSON.parse(JSON.stringify(DEFAULT_DB[k])); }); }
  // Clean done/weight/time from any old dayExercises template if migrating
  if(S.dayExercises && !S.plans){
    // Migrate old format to plan
    const plan=defaultPlan();
    plan.name='Treino Importado';
    for(let d=0;d<7;d++){
      if(S.dayExercises[d]&&S.dayExercises[d].length){
        plan.days[d]=S.dayExercises[d].map(item=>({
          exId:item.exId, sets:item.sets||4, reps:item.reps||12,
          weight:'', time:'', obs:'', rest:60, toFailure:false, technique:'none'
        }));
      }
    }
    S.plans=[plan];
    S.activePlanId=plan.id;
    delete S.dayExercises;
  }
  if(!S.plans){ S.plans=[defaultPlan()]; S.activePlanId=S.plans[0].id; }
  if(!S.history) S.history={};
  if(!S.dailyLogs) S.dailyLogs={};
  if(!S.weightHistory) S.weightHistory=[];
  if(!S.measures) S.measures=[];
}

function save(){
  localStorage.setItem('meuTreinoPro',JSON.stringify(S));
  if(!db||!currentUser) return;
  setSyncState('syncing');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushToFirestore, 2500);
}

function setSyncState(s){
  syncState=s;
  const dot=document.getElementById('syncDot');
  if(dot){ dot.className='sync-dot '+(s==='syncing'?'syncing':s==='synced'?'synced':s==='error'?'error':''); }
}

async function pushToFirestore(){
  if(!db||!currentUser) return;
  const uid=currentUser.uid;
  try{
    const main={profile:{...S.profile,photo:''},exerciseDB:S.exerciseDB,plans:S.plans,activePlanId:S.activePlanId,dailyLogs:S.dailyLogs,weightHistory:S.weightHistory,measures:S.measures};
    await db.collection('users').doc(uid).collection('data').doc('main').set(main);
    if(Object.keys(S.history).length>0) await db.collection('users').doc(uid).collection('data').doc('history').set({history:S.history});
    if(S.profile.photo) await db.collection('users').doc(uid).collection('data').doc('photo').set({photo:S.profile.photo});
    setSyncState('synced'); setTimeout(()=>setSyncState('idle'),3000);
  }catch(e){ console.error('Sync error:',e); setSyncState('error'); }
}

async function loadFromFirestore(){
  if(!db||!currentUser) return;
  const uid=currentUser.uid;
  try{
    const [mainDoc,histDoc,photoDoc]=await Promise.all([
      db.collection('users').doc(uid).collection('data').doc('main').get(),
      db.collection('users').doc(uid).collection('data').doc('history').get(),
      db.collection('users').doc(uid).collection('data').doc('photo').get()
    ]);
    if(mainDoc.exists){
      const d=mainDoc.data();
      if(d.profile) S.profile={...S.profile,...d.profile};
      if(d.exerciseDB) S.exerciseDB={...S.exerciseDB,...d.exerciseDB};
      if(d.plans) S.plans=d.plans;
      if(d.activePlanId) S.activePlanId=d.activePlanId;
      if(d.dailyLogs) S.dailyLogs=d.dailyLogs;
      if(d.weightHistory) S.weightHistory=d.weightHistory;
      if(d.measures) S.measures=d.measures;
    }
    if(histDoc.exists&&histDoc.data().history) S.history=histDoc.data().history;
    if(photoDoc.exists&&photoDoc.data().photo) S.profile.photo=photoDoc.data().photo;
    localStorage.setItem('meuTreinoPro',JSON.stringify(S));
  }catch(e){ console.error('Firestore load error:',e); }
}

function getOthers(log){
  const arr=(log&&log.others?log.others.slice():[]);
  if(log&&log.extraActivity && !arr.some(o=>o.a===log.extraActivity)) arr.push({a:log.extraActivity,t:log.extraTime||''});
  return arr;
}

function getPlanDaysLeft(plan){
  if(!plan||!plan.durationDays) return 'Sem prazo definido';
  const start=new Date(plan.startDate+'T12:00:00');
  const end=new Date(start); end.setDate(end.getDate()+plan.durationDays);
  const today=new Date(); const diff=Math.ceil((end-today)/(1000*60*60*24));
  if(diff<0) return '⚠️ Treino vencido — considere trocar';
  if(diff===0) return '⚠️ Último dia do treino!';
  return `${diff} dias restantes (termina ${end.getDate()}/${end.getMonth()+1}/${end.getFullYear()})`;
}

function buildCal(c){
  const today=new Date(), todayY=today.getFullYear(), todayM=today.getMonth(), todayD=today.getDate();
  const firstDay=new Date(calYear,calMonth,1).getDay(), daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  let h='<div class="cal-grid">';
  ['D','S','T','Q','Q','S','S'].forEach(d=>{h+=`<div class="cal-dow">${d}</div>`;});
  for(let i=0;i<firstDay;i++) h+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=todayY===calYear&&todayM===calMonth&&todayD===d;
    const dt=new Date(calYear,calMonth,d);
    const isPast=dt<new Date(todayY,todayM,todayD);
    const log=S.dailyLogs[ds]||{};
    let cls='cal-day'; if(isToday)cls+=' today'; if(log.trained)cls+=' trained'; else if(isPast&&!isToday)cls+=' missed'; else if(!isPast&&!isToday)cls+=' future';
    const hasOther=getOthers(log).length>0;
    let dots='';
    if(log.trained) dots+='<div class="cal-dot dot-green"></div>';
    else if(!hasOther && log.totalTime) dots+='<div class="cal-dot dot-orange"></div>';
    if(hasOther) dots+='<div class="cal-dot dot-blue"></div>';
    if(!dots && isPast && !isToday) dots='<div class="cal-dot dot-red"></div>';
    const dot=dots?`<div class="cal-dots">${dots}</div>`:'';
    h+=`<div class="${cls}" onclick="openCalDay('${ds}')">${d}${dot}</div>`;
  }
  h+='</div>'; c.innerHTML=h;
}

function buildRecent(c){
  const entries=Object.entries(S.dailyLogs).filter(([,v])=>v.trained||v.totalTime||getOthers(v).length).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);
  if(!entries.length){c.innerHTML='';return;}
  let h='<div class="section-label" style="margin-top:18px">Atividade Recente</div>';
  entries.forEach(([date,log])=>{
    const d=new Date(date+'T12:00:00');
    h+=`<div class="card-sm row-sb"><div><div style="font-weight:600;font-size:13px">${d.getDate()} ${MONTHS_PT[d.getMonth()].slice(0,3)} — ${DAYS_SHORT[d.getDay()]}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${log.totalTime?log.totalTime+' min':''}${getOthers(log).map(o=>' • '+o.a+(o.t?' '+o.t+'min':'')).join('')}${!log.totalTime&&!getOthers(log).length?'Registrado':''}</div></div>${log.trained?'<span class="tag tag-green">✓ Feito</span>':''}</div>`;
  });
  c.innerHTML=h;
}

function refreshCal(dir){
  const lbl=document.getElementById('calMonthLbl'), g=document.getElementById('calGrid');
  if(!lbl||!g){render();return;}
  lbl.textContent=MONTHS_PT[calMonth].toUpperCase()+' '+calYear;
  buildCal(g);
  g.style.animation='none'; void g.offsetHeight;
  g.style.animation=(dir>0?'slideL':'slideR')+' .25s ease';
}
function calPrev(){if(calMonth===0){calMonth=11;calYear--;}else calMonth--;refreshCal(-1);}
function calNext(){if(calMonth===11){calMonth=0;calYear++;}else calMonth++;refreshCal(1);}
function attachCalSwipe(){
  const el=document.getElementById('calCard'); if(!el) return;
  let sx=0,sy=0,t0=0;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();},{passive:true});
  el.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-t0<800){ if(dx<0) calNext(); else calPrev(); }
  },{passive:true});
}

function openCalDay(dateStr){
  const dt=new Date(dateStr+'T12:00:00'), dow=dt.getDay(), log=S.dailyLogs[dateStr]||{};
  const plan=getActivePlan(), dayExs=getPlanDayExs(plan,dow);
  const calSession=log.session||[];
  const isToday=dateStr===todayStr(), isPast=dt<new Date(new Date().toDateString());
  const doneCount=calSession.filter(e=>e.done).length, total=dayExs.length;
  const pct=total?Math.round(doneCount/total*100):0;
  let html='';
  if(log.trained) html+=`<div class="card-sm row" style="border-color:var(--accent);background:var(--accent-bg);margin-bottom:10px;gap:8px"><span>✅</span><span style="font-size:13px;font-weight:600">Dia concluído!</span></div>`;
  if(log.totalTime||getOthers(log).length) html+=`<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">${log.totalTime?`<span class="tag tag-green">⏱ ${log.totalTime} min</span>`:''}${getOthers(log).map(o=>`<span class="tag tag-blue">⚽ ${o.a}${o.t?' '+o.t+'min':''}</span>`).join('')}</div>`;
  html+=`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px"><span>${doneCount}/${total} exercícios</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  html+='<div class="section-label">Treino do Dia</div>';
  if(!dayExs.length) html+='<div style="text-align:center;padding:20px;color:var(--text3)">Nenhum exercício neste dia</div>';
  else dayExs.forEach((item,idx)=>{
    const ex=exDB(item.exId), s=calSession[idx]||item, isDone=!!s.done;
    const tagCls=ex.isCardio?'tag-orange':ex.group==='abdominal'?'tag-blue':'tag-green';
    html+=`<div class="card-sm" style="${isDone?'opacity:.5;':''}"><div style="font-weight:600;font-size:14px;${isDone?'text-decoration:line-through;color:var(--text3)':''}">${ex.name}${isDone?' ✓':''}</div><div style="font-size:11px;color:var(--text3);margin-top:3px"><span class="tag ${tagCls}" style="margin-right:5px">${GROUP_LABELS[ex.group]||ex.group}</span>${ex.isCardio?(s.time?s.time+' min':'—'):(s.sets||item.sets||4)+'×'+(s.reps||item.reps||12)+(s.weight?' • '+s.weight+'kg':'')}</div></div>`;
  });
  const btns=[{label:'Fechar',cls:'btn-ghost',fn:closeModal}];
  if(isToday) btns.unshift({label:'💪 Treinar Agora',cls:'btn-accent',fn:()=>{closeModal();nav('treino');}});
  else if(isPast&&!log.trained) btns.unshift({label:'✅ Registrar Dia',cls:'btn-accent',fn:()=>{closeModal();openEndDayFor(dateStr);}});
  if(isToday||isPast) btns.splice(btns.length-1,0,{label:'⚽ Outros',cls:'btn-blue',fn:()=>{closeModal();openOthersFor(dateStr);}});
  showModal(`${dt.getDate()} de ${MONTHS_PT[dt.getMonth()]} — ${DAYS_FULL[dow]}`, html, btns);
}

function openEndDay(){ openEndDayFor(todayStr()); }

function openOthersFor(ds){
  if(!S.dailyLogs[ds]) S.dailyLogs[ds]={trained:false};
  const cur=S.dailyLogs[ds].others||[];
  const dt=new Date(ds+'T12:00:00');

    const c=cur.find(o=>o.a===a);

      <div class="weight-wrap" style="width:96px" onclick="event.stopPropagation()"><input class="weight-input" id="othT_${i}" type="number" inputmode="numeric" placeholder="0" value="${c&&c.t?c.t:''}" oninput="if(this.value) markOth(${i})"><span class="weight-unit">min</span></div>
    </div>`;}).join('');
  showModal(`Outros — ${dt.getDate()}/${dt.getMonth()+1}`,
    `<div style="font-size:12px;color:var(--text3);margin-bottom:12px">Marque a(s) atividade(s) e informe o tempo. O dia ganha uma bolinha 🔵 no calendário.</div>${rows}`,

        if(sel||(parseInt(t)>0)) out.push({a,t});
      });
      S.dailyLogs[ds].others=out;
      save(); closeModal(); render(); showToast(out.length?'✅ Registrado!':'Registro removido');
    }},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]);
}
function toggleOth(i){
  const el=document.getElementById('oth_'+i), box=document.getElementById('othBox_'+i);
  el.classList.toggle('selected'); box.textContent=el.classList.contains('selected')?'✓':'';
}
function markOth(i){
  const el=document.getElementById('oth_'+i), box=document.getElementById('othBox_'+i);
  el.classList.add('selected'); box.textContent='✓';
}

function openEndDayFor(dateStr){
  if(!S.dailyLogs[dateStr]) S.dailyLogs[dateStr]={trained:false};
  const log=S.dailyLogs[dateStr];
  const dt=new Date(dateStr+'T12:00:00');
  showModal(`Registrar ${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`,`
    <div class="input-group"><div class="input-label">⏱ Tempo Total do Treino</div><div class="weight-wrap"><input class="weight-input" id="mTime" type="number" inputmode="numeric" placeholder="0" value="${log.totalTime||''}"><span class="weight-unit">min</span></div></div>
    <div class="input-group"><div class="input-label">🏃 Atividade Adicional</div><select class="input" id="mAct"><option value="">— Nenhuma —</option>${ACTIVITIES.map(a=>`<option value="${a}"${log.extraActivity===a?' selected':''}>${a}</option>`).join('')}</select></div>
    <div class="input-group"><div class="input-label">⏱ Tempo da Atividade</div><div class="weight-wrap"><input class="weight-input" id="mActTime" type="number" inputmode="numeric" placeholder="0" value="${log.extraTime||''}"><span class="weight-unit">min</span></div></div>
    <div class="chk-item${log.trained?' selected':''}" id="trainedChk" onclick="toggleTrainedFor('${dateStr}')"><div class="chk-box" id="trainedBox">${log.trained?'✓':''}</div><div><div style="font-weight:600;font-size:14px">Marcar como concluído</div><div style="font-size:11px;color:var(--text3)">Aparece ✅ no calendário</div></div></div>`,
    [{label:'💾 Salvar',cls:'btn-accent',fn:()=>{log.totalTime=document.getElementById('mTime').value;log.extraActivity=document.getElementById('mAct').value;log.extraTime=document.getElementById('mActTime').value;save();closeModal();render();}},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]
  );
}
function toggleTrainedFor(ds){
  if(!S.dailyLogs[ds]) S.dailyLogs[ds]={trained:false};
  S.dailyLogs[ds].trained=!S.dailyLogs[ds].trained;
  const chk=document.getElementById('trainedChk'),box=document.getElementById('trainedBox');
  if(chk) chk.classList.toggle('selected',S.dailyLogs[ds].trained);
  if(box) box.textContent=S.dailyLogs[ds].trained?'✓':'';
  save();
}

function renderTreino(scr){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;height:100%';
  wrap.insertAdjacentHTML('beforeend',`<div class="page-header"><div class="page-title">TREINO</div><div class="page-sub">Registre sua sessão</div></div>`);
  const plan=getActivePlan();
  const bar=document.createElement('div'); bar.className='days-bar';
  DAYS_SHORT.forEach((label,d)=>{
    const exs=getPlanDayExs(plan,d);
    const ds=dateForDow(d);
    const existSess=S.dailyLogs[ds]?.session;
    const done=existSess?existSess.filter(e=>e.done).length:0;
    const isToday=d===new Date().getDay();
    const btn=document.createElement('button');
    btn.className='day-btn'+(d===activeDay?' active':'')+(done>0?' has-done':'');
    btn.innerHTML=`<span class="da">${label}${isToday?'•':''}</span><span class="dp">${done}/${exs.length}</span>`;
    btn.onclick=()=>{activeDay=d;render();};
    bar.appendChild(btn);
  });
  wrap.appendChild(bar);

  const content=document.createElement('div');
  content.className='pad';
  content.style.cssText='flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none';

  if(!plan){
    content.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px">📋</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px">Nenhum Plano Ativo</div><button class="btn btn-accent" style="margin-top:16px" onclick="nav('planos')">Criar Plano de Treino</button></div>`;
  } else {
    const tmplExs=getPlanDayExs(plan,activeDay);
    const sessionExs=getSession(activeDay);
    const dayExs=tmplExs.map((t,i)=>{
      const s=sessionExs[i]||{exId:t.exId,sets:t.sets,reps:t.reps,weight:'',time:'',done:false,obs:''};
      return {...t,...s};
    });
    if(!dayExs.length){
      content.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px">😴</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px">Descanso!</div><div style="font-size:13px;margin-top:6px">Nenhum treino para ${DAYS_FULL[activeDay]}</div><button class="btn btn-ghost" style="margin-top:16px" onclick="openAddExToPlan(${activeDay})">+ Adicionar Exercício</button></div>`;
    } else {
      let lastGroup=null;
      dayExs.forEach((item,idx)=>{
        const ex=exDB(item.exId), grpKey=GROUP_LABELS[ex.group]||ex.group;
        if(grpKey!==lastGroup){const sep=document.createElement('div');sep.className='section-label anim';sep.textContent=grpKey;content.appendChild(sep);lastGroup=grpKey;}
        content.appendChild(buildExCard(item,idx,ex));
      });
      const addBtn=document.createElement('button');
      addBtn.className='btn btn-ghost btn-full'; addBtn.style.marginTop='8px';
      addBtn.innerHTML='+ Adicionar Exercício'; addBtn.onclick=()=>openAddExToPlan(activeDay);
      content.appendChild(addBtn);
    }
  }
  wrap.appendChild(content);

  const plan2=getActivePlan(), dayExs2=getPlanDayExs(plan2,activeDay);
  const sess2=S.dailyLogs[dateForDow(activeDay)]?.session||[];
  const done2=sess2.filter(e=>e.done).length, pct=dayExs2.length?Math.round(done2/dayExs2.length*100):0;
  const prog=document.createElement('div'); prog.className='prog-bar-wrap';
  prog.innerHTML=`<div class="prog-info"><span class="prog-label">${done2}/${dayExs2.length} — ${DAYS_FULL[activeDay]}</span><span class="prog-pct">${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>`;
  wrap.appendChild(prog);
  scr.appendChild(wrap);
}

function buildExCard(item,idx,ex){
  const isCardio=!!ex.isCardio, isAbs=ex.group==='abdominal', isExtra=ex.group==='panturrilha'||ex.group==='antebraco';
  const typeClass=isCardio?'cardio-t':isAbs?'abs-t':isExtra?'extra-t':'';
  const tagCls=isCardio?'tag-orange':isAbs?'tag-blue':isExtra?'tag-purple':'tag-green';
  const techTag=item.technique&&item.technique!=='none'?`<span class="tech-badge tech-${item.technique}">⚡ ${item.technique}</span>`:'';
  const card=document.createElement('div');
  card.className=`ex-card anim ${typeClass}${item.done?' done':''}`;
  card.style.animationDelay=(idx*.04)+'s';
  const top=document.createElement('div'); top.className='row-sb'; top.style.marginBottom='10px';
  top.innerHTML=`<div style="flex:1;min-width:0"><div class="ex-name">${ex.name}</div><div style="font-size:11px;color:var(--text3);margin-top:3px"><span class="tag ${tagCls}" style="margin-right:5px">${GROUP_LABELS[ex.group]||ex.group}</span>${ex.muscle}</div>${techTag}${item.toFailure?'<span style="font-size:10px;color:var(--red);font-weight:700;margin-top:2px;display:block">🔥 ATÉ A FALHA</span>':''}</div>
    <div class="row" style="gap:5px;flex-shrink:0">
      <button class="icon-btn" onclick="openExConfig(${activeDay},${idx})" title="Configurar">⚙️</button>
      <button class="icon-btn" onclick="openSwap(${activeDay},${idx})" title="Trocar">⇄</button>
      <button class="icon-btn" style="color:var(--red)" onclick="removeExFromPlan(${activeDay},${idx})">✕</button>
      <button class="check-btn${item.done?' checked':''}" onclick="toggleDone(${activeDay},${idx})">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  card.appendChild(top);
  if(isCardio){
    const cl=document.createElement('div'); cl.innerHTML='<div class="ctrl-lbl">⏱ Duração</div>';
    const w=document.createElement('div'); w.className='weight-wrap';
    const inp=document.createElement('input'); inp.className='weight-input'; inp.type='number'; inp.inputMode='numeric'; inp.placeholder='0'; inp.value=item.time||'';
    inp.oninput=()=>{ item.time=inp.value; const sess=getSession(activeDay); if(sess[idx]) sess[idx].time=inp.value; save(); };
    const u=document.createElement('span'); u.className='weight-unit'; u.textContent='min';
    w.append(inp,u); cl.appendChild(w); card.appendChild(cl);
  } else {
    const ctrl=document.createElement('div'); ctrl.className='ex-ctrl-row';
    const gs=document.createElement('div'); gs.innerHTML='<div class="ctrl-lbl">Séries</div>';
    gs.appendChild(mkStep(item.sets,1,20,v=>{ item.sets=v; const sess=getSession(activeDay); if(sess[idx]) sess[idx].sets=v; save(); }));
    const gr=document.createElement('div'); gr.innerHTML='<div class="ctrl-lbl">Repetições</div>';
    gr.appendChild(mkStep(item.reps,1,60,v=>{ item.reps=v; const sess=getSession(activeDay); if(sess[idx]) sess[idx].reps=v; save(); }));
    const gw=document.createElement('div'); gw.style.gridColumn='1/-1'; gw.innerHTML='<div class="ctrl-lbl">Carga (kg)</div>';
    const ww=document.createElement('div'); ww.className='weight-wrap';
    const wi=document.createElement('input'); wi.className='weight-input'; wi.type='number'; wi.inputMode='decimal'; wi.placeholder='0'; wi.value=item.weight||'';
    wi.oninput=()=>{ item.weight=wi.value; const sess=getSession(activeDay); if(sess[idx]) sess[idx].weight=wi.value; save(); };
    const wu=document.createElement('span'); wu.className='weight-unit'; wu.textContent='kg';
    ww.append(wi,wu); gw.appendChild(ww);
    if(item.rest){ const restEl=document.createElement('div'); restEl.style.gridColumn='1/-1'; restEl.innerHTML=`<div style="font-size:10px;color:var(--text3)">⏸ Descanso: <strong style="color:var(--text2)">${item.rest}s</strong></div>`; ctrl.append(gs,gr,gw,restEl); }
    else ctrl.append(gs,gr,gw);
    card.appendChild(ctrl);
  }
  if(item.obs){ const obsEl=document.createElement('div'); obsEl.style.cssText='font-size:11px;color:var(--text3);margin-top:8px;font-style:italic'; obsEl.textContent='📝 '+item.obs; card.appendChild(obsEl); }
  return card;
}

function mkStep(init,min,max,cb){
  let v=init; const w=document.createElement('div'); w.className='stepper';
  const m=document.createElement('button'); m.className='step-btn'; m.textContent='−';
  const d=document.createElement('div'); d.className='step-val'; d.textContent=v;
  const p=document.createElement('button'); p.className='step-btn'; p.textContent='+';
  m.onclick=()=>{if(v>min){v--;d.textContent=v;cb(v);}};
  p.onclick=()=>{if(v<max){v++;d.textContent=v;cb(v);}};
  w.append(m,d,p); return w;
}

function renderKeepScroll(){
  const sc=document.querySelector('#screen .pad');
  const top=sc?sc.scrollTop:0;
  render();
  const sc2=document.querySelector('#screen .pad');
  if(sc2) sc2.scrollTop=top;
}

function toggleDone(dow,idx){
  const sess=getSession(dow);
  sess[idx].done=!sess[idx].done;
  if(sess[idx].done) recordHistory(sess[idx].exId,sess[idx]);
  save(); renderKeepScroll();
}

function removeExFromPlan(dow,idx){
  const plan=getActivePlan(); if(!plan) return;
  if(!plan.days[dow]) return;
  plan.days[dow].splice(idx,1);
  // PRESERVE session — just remove that specific index
  const ds=dateForDow(dow);
  if(S.dailyLogs[ds]?.session){
    S.dailyLogs[ds].session.splice(idx,1);
  }
  save(); renderKeepScroll();
}

function openExConfig(dow,idx){
  const plan=getActivePlan(); if(!plan) return;
  const item=plan.days[dow][idx]; const ex=exDB(item.exId); _ecFailure=!!item.toFailure;
  showModal(`⚙️ ${ex.name}`,`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div class="input-group" style="margin-bottom:0"><div class="input-label">Séries</div><input class="input" id="ecSets" type="number" inputmode="numeric" value="${item.sets||4}"></div>
      <div class="input-group" style="margin-bottom:0"><div class="input-label">Repetições</div><input class="input" id="ecReps" type="number" inputmode="numeric" value="${item.reps||12}"></div>
    </div>
    <div class="input-group"><div class="input-label">Carga sugerida (kg)</div><div class="weight-wrap"><input class="weight-input" id="ecWeight" type="number" inputmode="decimal" placeholder="0" value="${item.weight||''}"><span class="weight-unit">kg</span></div></div>
    <div class="input-group"><div class="input-label">⏸ Descanso entre séries</div><div class="weight-wrap"><input class="weight-input" id="ecRest" type="number" inputmode="numeric" placeholder="60" value="${item.rest||60}"><span class="weight-unit">seg</span></div></div>
    <div class="input-group"><div class="input-label">⚡ Técnica Avançada</div><select class="input" id="ecTech">${TECHNIQUES.map(t=>`<option value="${t.v}"${item.technique===t.v?' selected':''}>${t.l}</option>`).join('')}</select></div>
    <div class="chk-item${item.toFailure?' selected':''}" id="ecFailureChk" onclick="toggleEcFailure()"><div class="chk-box" id="ecFailureBox">${item.toFailure?'✓':''}</div><div><div style="font-weight:600;font-size:14px">🔥 Executar até a falha</div><div style="font-size:11px;color:var(--text3)">Última série vai até o limite</div></div></div>
    <div class="input-group"><div class="input-label">📝 Observações</div><textarea class="input" id="ecObs" placeholder="Dicas, foco, execução...">${item.obs||''}</textarea></div>`,
    [{label:'💾 Salvar',cls:'btn-accent',fn:()=>{
      item.sets=parseInt(document.getElementById('ecSets').value)||4;
      item.reps=parseInt(document.getElementById('ecReps').value)||12;
      item.weight=document.getElementById('ecWeight').value;
      item.rest=parseInt(document.getElementById('ecRest').value)||60;
      item.technique=document.getElementById('ecTech').value;
      item.obs=document.getElementById('ecObs').value;
      item.toFailure=_ecFailure;
      // Update session entry without wiping other entries
      const ds=dateForDow(dow);
      if(S.dailyLogs[ds]?.session?.[idx]){
        const s=S.dailyLogs[ds].session[idx];
        s.sets=item.sets; s.reps=item.reps; s.obs=item.obs;
        // Don't reset done/weight — preserve what user already entered
      }
      save(); closeModal(); renderKeepScroll();
    }},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]
  );
}

let _ecFailure=false;
function toggleEcFailure(){
  _ecFailure=!_ecFailure;
  const plan=getActivePlan();
  const chk=document.getElementById('ecFailureChk'), box=document.getElementById('ecFailureBox');
  if(chk) chk.classList.toggle('selected',_ecFailure);
  if(box) box.textContent=_ecFailure?'✓':'';
}

function openSwap(dow,idx){
  const plan=getActivePlan(); if(!plan) return;
  const cur=plan.days[dow][idx], curEx=exDB(cur.exId);
  let selGrp=curEx.group||'peito';
  const rs=()=>{
    const list=Object.entries(S.exerciseDB).filter(([,ex])=>ex.group===selGrp&&ex.active).sort((a,b)=>a[1].name.localeCompare(b[1].name));
    const body=document.getElementById('modalBody'); if(!body) return;
    body.innerHTML=`<div style="font-size:12px;color:var(--text3);margin-bottom:10px">Substituindo: <strong style="color:var(--text)">${curEx.name}</strong></div>
      <div class="tgl-group" style="flex-wrap:wrap">${GROUP_ORDER.map(g=>`<button class="tgl-btn${selGrp===g?' active':''}" onclick="window._sg('${g}')">${GROUP_LABELS[g]}</button>`).join('')}</div>
      ${list.map(([id,ex])=>`<div class="list-item anim${id===cur.exId?' selected':''}" onclick="doSwap(${dow},${idx},'${id}')"><div class="li-info"><div class="li-name">${ex.name}</div><div class="li-sub">${ex.muscle}</div></div>${id===cur.exId?'<span class="tag tag-green">Atual</span>':'<span style="font-size:20px;color:var(--accent)">⇄</span>'}</div>`).join('')}
      ${!list.length?'<div style="text-align:center;padding:30px;color:var(--text3)">Nenhum exercício ativo</div>':''}`;
  };
  window._sg=(g)=>{selGrp=g;rs();};
  showModal(`Trocar — ${DAYS_SHORT[dow]}`,'',
    [{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]); rs();
}

function doSwap(dow,idx,newId){
  const plan=getActivePlan(); if(!plan) return;
  const old=plan.days[dow][idx];
  plan.days[dow][idx]={exId:newId,sets:old.sets,reps:old.reps,weight:'',time:'',obs:'',rest:old.rest||60,toFailure:false,technique:'none'};
  // PRESERVE session — only replace that specific entry, keep others intact
  const ds=dateForDow(dow);
  if(S.dailyLogs[ds]?.session){
    S.dailyLogs[ds].session[idx]={exId:newId,sets:old.sets,reps:old.reps,weight:'',time:'',done:false,obs:''};
  }
  save(); closeModal(); renderKeepScroll();
}

function openAddExToPlan(dow){
  let selGrp='peito';
  const rp=()=>{
    const list=Object.entries(S.exerciseDB).filter(([,ex])=>ex.group===selGrp&&ex.active).sort((a,b)=>a[1].name.localeCompare(b[1].name));
    const body=document.getElementById('modalBody'); if(!body) return;
    body.innerHTML=`<div class="tgl-group" style="flex-wrap:wrap">${GROUP_ORDER.map(g=>`<button class="tgl-btn${selGrp===g?' active':''}" onclick="window._pg('${g}')">${GROUP_LABELS[g]}</button>`).join('')}</div>
      ${list.map(([id,ex])=>`<div class="list-item anim" onclick="addExToPlan(${dow},'${id}')"><div class="li-info"><div class="li-name">${ex.name}</div><div class="li-sub">${ex.muscle}</div></div><span style="font-size:20px;color:var(--accent)">+</span></div>`).join('')}
      ${!list.length?'<div style="text-align:center;padding:30px;color:var(--text3)">Nenhum exercício ativo</div>':''}`;
  };
  window._pg=(g)=>{selGrp=g;rp();};
  showModal(`+ Adicionar em ${DAYS_SHORT[dow]}`,'',
    [{label:'Fechar',cls:'btn-ghost',fn:closeModal}]); rp();
}

function addExToPlan(dow,exId){
  const plan=getActivePlan(); if(!plan) return;
  if(!plan.days[dow]) plan.days[dow]=[];
  plan.days[dow].push({exId,sets:4,reps:12,weight:'',time:'',obs:'',rest:60,toFailure:false,technique:'none'});
  // PRESERVE existing session — just append new blank entry instead of wiping
  const ds=dateForDow(dow);
  if(S.dailyLogs[ds]?.session){
    S.dailyLogs[ds].session.push({exId,sets:4,reps:12,weight:'',time:'',done:false,obs:''});
  }
  // If no session yet, getSession() will build it fresh from template — that's fine
  save(); closeModal(); showToast('✅ Exercício adicionado!'); if(currentTab==='treino') renderKeepScroll();
}

function renderPlanos(scr){
  const div=document.createElement('div');
  const plans=S.plans||[];
  const active=plans.filter(p=>!p.archived);
  const archived=plans.filter(p=>p.archived);

  div.innerHTML=`<div class="page-header row-sb"><div><div class="page-title">PLANOS</div><div class="page-sub">Gerenciar treinos</div></div><button class="btn btn-accent btn-sm" onclick="openNewPlan()">+ Novo</button></div>
  <div class="pad">
    ${!plans.length?`<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px">📋</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px">Nenhum Plano</div><button class="btn btn-accent" style="margin-top:16px" onclick="openNewPlan()">Criar Primeiro Plano</button></div>`:''}
    ${active.map(p=>renderPlanCard(p)).join('')}
    ${archived.length?`<div class="section-label">Histórico de Planos</div>${archived.map(p=>renderPlanCard(p,true)).join('')}`:''}
  </div>`;
  scr.appendChild(div);
}

function renderPlanCard(plan, archived=false){
  const isActive=plan.id===S.activePlanId&&!archived;
  const daysLeft=getPlanDaysLeft(plan);
  const activeDays=Object.keys(plan.days||{}).filter(d=>(plan.days[d]||[]).length>0).map(d=>parseInt(d)).sort();
  const pillsHTML=DAYS_SHORT.map((s,d)=>{
    const isTrainDay=activeDays.includes(d);
    return `<span class="plan-day-pill${isTrainDay?' active-day':''}">${s}</span>`;
  }).join('');
  return `<div class="plan-card${isActive?' active-plan':''}">
    <div class="row-sb">
      <div>
        <div class="plan-name">${plan.name}</div>
        <div class="plan-meta">${plan.goal||''}${plan.durationDays?' • '+plan.durationDays+' dias':' • Sem prazo'}</div>
        ${isActive?`<div style="font-size:11px;color:var(--accent);margin-top:2px">${daysLeft}</div>`:''}
      </div>
      ${isActive?'<span class="tag tag-green">ATIVO</span>':archived?'<span class="tag tag-purple">ARQUIVADO</span>':''}
    </div>
    <div class="plan-days-row">${pillsHTML}</div>
    <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
      ${!isActive&&!archived?`<button class="btn btn-accent btn-sm" onclick="activatePlan('${plan.id}')">▶ Ativar</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="openEditPlan('${plan.id}')">✏️ Editar</button>
      <button class="btn btn-blue btn-sm" onclick="duplicatePlan('${plan.id}')">⧉ Duplicar</button>
      ${!archived?`<button class="btn btn-ghost btn-sm" onclick="archivePlan('${plan.id}')">📦 Arquivar</button>`:`<button class="btn btn-ghost btn-sm" onclick="restorePlan('${plan.id}')">↩ Restaurar</button>`}
      <button class="btn btn-danger btn-sm" onclick="deletePlan('${plan.id}')">🗑 Excluir</button>
    </div>
  </div>`;
}

function openNewPlan(){
  const tmpPlan={id:'_new',name:'Meu Treino',goal:'Hipertrofia',startDate:localDateStr(),durationDays:90,active:false,archived:false,days:{}};
  editPlanForm(tmpPlan, true);
}

function openEditPlan(planId){
  const plan=S.plans.find(p=>p.id===planId); if(!plan) return;
  editPlanForm(plan, false);
}

function editPlanForm(plan,isNew){
  window._tmpPlan=JSON.parse(JSON.stringify(plan));
  window._tmpPlanIsNew=isNew;
  if(!window._tmpPlan.days) window._tmpPlan.days={};
  const daysHtml=DAYS_FULL.map((d,i)=>`<div class="card-sm" style="margin-bottom:8px">
      <div class="row-sb">
        <div style="font-weight:600;font-size:13px">${d}<span id="planCnt_${i}" style="font-size:11px;color:var(--text3);margin-left:8px"></span></div>
        <button class="btn btn-ghost btn-sm" onclick="openAddExToNewPlan(${i})">+ Add</button>
      </div>
      <div id="planDay_${i}" style="margin-top:6px"></div>
    </div>`).join('');

  showModal(isNew?'Novo Plano':'Editar Plano',`
    <div class="input-group"><div class="input-label">Nome do Plano</div><input class="input" id="pName" placeholder="Ex: Treino A — Hipertrofia" value="${plan.name||''}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="input-group" style="margin-bottom:0"><div class="input-label">Objetivo</div><select class="input" id="pGoal">${GOALS.map(g=>`<option value="${g}"${plan.goal===g?' selected':''}>${g}</option>`).join('')}</select></div>
      <div class="input-group" style="margin-bottom:0"><div class="input-label">Duração</div><select class="input" id="pDur">${DURATIONS.map(d=>`<option value="${d.v}"${plan.durationDays===d.v?' selected':''}>${d.l}</option>`).join('')}</select></div>
    </div>
    <div class="section-label" style="margin-top:16px">Dias de Treino</div>
    ${daysHtml}`,
    [{label:isNew?'✅ Criar Plano':'💾 Salvar',cls:'btn-accent',fn:()=>{
      const p=window._tmpPlan;
      p.name=document.getElementById('pName').value||'Meu Treino';
      p.goal=document.getElementById('pGoal').value;
      p.durationDays=parseInt(document.getElementById('pDur').value)||0;
      if(window._tmpPlanIsNew){
        p.id=makePlanId(); p.startDate=localDateStr(); p.archived=false;
        p.active=!S.plans.some(pl=>pl.active&&!pl.archived);
        S.plans.push(p);
        if(p.active) S.activePlanId=p.id;
      } else {
        const i=S.plans.findIndex(pl=>pl.id===p.id);
        if(i>=0) S.plans[i]=p;
      }
      save(); closeModal(); render();
    }},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]
  );
  DAYS_FULL.forEach((_,i)=>refreshTmpPlanDay(i));
}

function refreshTmpPlanDay(dow){
  const p=window._tmpPlan; if(!p) return;
  const exs=(p.days&&p.days[dow])||[];
  const el=document.getElementById('planDay_'+dow), cnt=document.getElementById('planCnt_'+dow);
  if(cnt) cnt.textContent=exs.length+' exercício'+(exs.length!==1?'s':'');
  if(!el) return;
  el.innerHTML=exs.length?exs.map((e,ei)=>{
    const ex=exDB(e.exId);
    return `<div style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;min-width:0">${ex.name}</span>
      <span style="color:var(--text3)">${e.sets}×${e.reps}</span>
      <button class="icon-btn" style="color:var(--red);width:24px;height:24px;font-size:11px" onclick="removeFromTmpPlan(${dow},${ei})">✕</button>
    </div>`;}).join(''):'<div style="font-size:11px;color:var(--text3)">Dia de descanso</div>';
}

function removeFromTmpPlan(dow,ei){
  const p=window._tmpPlan; if(!p||!p.days||!p.days[dow]) return;
  p.days[dow].splice(ei,1);
  refreshTmpPlanDay(dow);
}

function closeOverlay2(){

  document.getElementById('modal2')?.remove();
}

function openAddExToNewPlan(dow){

  let selGrp='peito';
  const rp=()=>{

  modal2.innerHTML=`<div style="width:36px;height:4px;background:var(--border2);border-radius:4px;margin:10px auto 0"></div>

function addToTmpPlan(dow,exId){
  const p=window._tmpPlan; if(!p) return;
  if(!p.days) p.days={};
  if(!p.days[dow]) p.days[dow]=[];
  p.days[dow].push({exId,sets:4,reps:12,weight:'',time:'',obs:'',rest:60,toFailure:false,technique:'none'});
  refreshTmpPlanDay(dow);
  closeOverlay2();
  showToast('✅ Exercício adicionado!');
}

function deletePlan(planId){
  const plan=S.plans.find(p=>p.id===planId); if(!plan) return;
  const wasActive=S.activePlanId===planId&&plan.active;
  showModal('🗑 Excluir Plano',`<div style="text-align:center;padding:16px 0">
      <div style="font-size:44px;margin-bottom:10px">🗑</div>
      <div style="font-size:16px;font-weight:700">Excluir "${plan.name}"?</div>
      <div style="font-size:13px;color:var(--text3);margin-top:8px;line-height:1.5">O plano será removido definitivamente. O histórico de cargas e os dias já registrados no calendário são mantidos.${wasActive?'<br><br>Este é o plano ativo — outro plano disponível será ativado.':''}</div>
    </div>`,
    [{label:'🗑 Excluir',cls:'btn-danger',fn:()=>{
      S.plans=S.plans.filter(p=>p.id!==planId);
      if(S.activePlanId===planId){
        const next=S.plans.find(p=>!p.archived);
        S.activePlanId=next?next.id:null;
        S.plans.forEach(p=>{p.active=!!next&&p.id===next.id;});
      }
      save(); closeModal(); render(); showToast('🗑 Plano excluído');
    }},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]);
}

function activatePlan(planId){
  S.plans.forEach(p=>{p.active=p.id===planId;});
  S.activePlanId=planId;
  // Reseta só sessões de hoje em diante (preserva o histórico dos dias passados)
  const _t=todayStr();
  Object.keys(S.dailyLogs).forEach(ds=>{if(ds>=_t && S.dailyLogs[ds]) delete S.dailyLogs[ds].session;});
  save(); render(); showToast('✅ Plano ativado!');
}

function duplicatePlan(planId){
  const plan=S.plans.find(p=>p.id===planId); if(!plan) return;
  const copy=JSON.parse(JSON.stringify(plan));
  copy.id=makePlanId(); copy.name=plan.name+' (Cópia)'; copy.active=false; copy.archived=false; copy.startDate=localDateStr();
  S.plans.push(copy); save(); render(); showToast('✅ Plano duplicado!');
}

function archivePlan(planId){
  const plan=S.plans.find(p=>p.id===planId); if(!plan) return;
  plan.archived=true; plan.active=false;
  if(S.activePlanId===planId){
    const other=S.plans.find(p=>!p.archived);
    S.activePlanId=other?other.id:null;
    if(other) other.active=true;
  }
  save(); render();
}

function restorePlan(planId){
  const plan=S.plans.find(p=>p.id===planId); if(!plan) return;
  plan.archived=false; save(); render();
}

function renderEvolCargas(){
  const c=document.getElementById('evolContent'); if(!c) return;

  if(!withH.length){c.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px">📊</div><div style="font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:2px">Sem histórico ainda</div><div style="font-size:13px;margin-top:8px">Complete treinos com carga para ver evolução</div></div>';return;}

function renderGroupCharts(g, wrap){
  wrap.innerHTML='';
  const exsInGroup=Object.entries(S.exerciseDB).filter(([id,ex])=>ex.group===g&&S.history[id]&&S.history[id].length>0).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  if(!exsInGroup.length){wrap.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">Sem dados para este grupo ainda</div>';return;}
  exsInGroup.forEach(([exId,ex])=>{
    const data=(S.history[exId]||[]).slice(-20);
    if(!data.length) return;
    const block=document.createElement('div');
    block.innerHTML=buildHistBlock(exId,ex,data);
    wrap.appendChild(block);
  });
}

function buildHistBlock(exId,ex,data){
  const weights=data.map(d=>parseFloat(d.weight)||0);
  const maxW=Math.max(...weights)||1, minW=Math.min(...weights), range=maxW-minW||1;
  const W=300,H=120,PL=34,PR=8,PT=12,PB=24,cw=W-PL-PR,ch=H-PT-PB;
  const pts=data.map((d,i)=>({x:PL+(data.length>1?i/(data.length-1)*cw:cw/2),y:PT+(1-(parseFloat(d.weight)-minW)/range)*ch,...d}));
  const pathD=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const areaD=pathD+` L${pts[pts.length-1].x.toFixed(1)} ${H-PB} L${pts[0].x.toFixed(1)} ${H-PB} Z`;
  const ticks=[minW,minW+range/2,maxW].map(v=>{const y=PT+(1-(v-minW)/range)*ch;return `<text x="${PL-3}" y="${(y+3).toFixed(1)}" text-anchor="end" fill="var(--text3)" font-size="8">${v%1===0?v:v.toFixed(1)}</text><line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>`;}).join('');
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('');
  const xl=pts.filter((_,i)=>i===0||i===pts.length-1||(pts.length<=5)).map(p=>{const d=new Date(p.date+'T12:00:00');return `<text x="${p.x.toFixed(1)}" y="${H-2}" text-anchor="middle" fill="var(--text3)" font-size="8">${d.getDate()}/${d.getMonth()+1}</text>`;}).join('');
  const last=weights[weights.length-1], first=weights[0], diff=(last-first).toFixed(1);
  const diffC=parseFloat(diff)>0?'var(--accent)':parseFloat(diff)<0?'var(--red)':'var(--text3)';
  return `<div class="chart-wrap">
    <div class="row-sb" style="margin-bottom:8px"><div style="font-weight:700;font-size:14px;flex:1;min-width:0">${ex.name}</div>
      <div class="row" style="gap:12px;flex-shrink:0">
        <div style="text-align:right"><div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1">${last}kg</div><div style="font-size:9px;color:var(--text3)">Último</div></div>
        <div style="text-align:right"><div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${diffC};line-height:1">${parseFloat(diff)>0?'+':''}${diff}kg</div><div style="font-size:9px;color:var(--text3)">Variação</div></div>
        <div style="text-align:right"><div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--blue);line-height:1">${maxW}kg</div><div style="font-size:9px;color:var(--text3)">Máx</div></div>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible">${ticks}<path d="${areaD}" fill="var(--accent)" opacity="0.07"/><path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>
    <details style="margin-top:8px"><summary style="font-size:11px;color:var(--text3);cursor:pointer">▸ Ver registros (${data.length})</summary>
      <table class="hist-table"><thead><tr><th>Data</th><th>Carga</th><th>Séries × Reps</th></tr></thead>
      <tbody>${[...data].reverse().map(d=>{const dt=new Date(d.date+'T12:00:00');return `<tr><td style="color:var(--text2)">${dt.getDate()} ${MONTHS_PT[dt.getMonth()].slice(0,3)}</td><td><strong style="color:var(--accent)">${d.weight}kg</strong></td><td style="color:var(--text2)">${d.sets}×${d.reps}</td></tr>`;}).join('')}</tbody></table>
    </details>
  </div>`;
}

function renderEvolFrequencia(){
  const c=document.getElementById('evolContent'); if(!c) return;
  const logs=Object.entries(S.dailyLogs).filter(([,v])=>v.trained).map(([d])=>d).sort();
  if(logs.length<2){c.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:12px">📅</div><div style="font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:2px">Dados insuficientes</div><div style="font-size:13px;margin-top:8px">Complete pelo menos 2 treinos para ver frequência</div></div>';return;}

  // Weekly frequency last 12 weeks
  const weeks={};
  logs.forEach(ds=>{
    const d=new Date(ds+'T12:00:00');
    const weekStart=new Date(d); weekStart.setDate(d.getDate()-d.getDay());
    const wk=localDateStr(weekStart);
    weeks[wk]=(weeks[wk]||0)+1;
  });
  const wkEntries=Object.entries(weeks).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  const maxWk=Math.max(...wkEntries.map(([,v])=>v),1);

  // Bar chart
  const W=300,H=100,PL=20,PB=20,barGap=4;
  const barW=(W-PL-barGap*(wkEntries.length-1))/wkEntries.length;
  const bars=wkEntries.map(([wk,cnt],i)=>{
    const bh=Math.round((cnt/maxWk)*(H-PB));
    const x=PL+i*(barW+barGap), y=H-PB-bh;
    const d=new Date(wk+'T12:00:00');
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${bh}" rx="3" fill="var(--accent)" opacity="0.85"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${H-5}" text-anchor="middle" fill="var(--text3)" font-size="7">${d.getDate()}/${d.getMonth()+1}</text>
      ${cnt>0?`<text x="${(x+barW/2).toFixed(1)}" y="${y-3}" text-anchor="middle" fill="var(--accent)" font-size="8" font-weight="bold">${cnt}</text>`:''}`;
  }).join('');

  // Stats
  const totalTrained=logs.length;
  const firstDate=new Date(logs[0]+'T12:00:00'), lastDate=new Date(logs[logs.length-1]+'T12:00:00');
  const totalDays=Math.ceil((lastDate-firstDate)/(1000*60*60*24))+1;
  const avgWeek=(totalTrained/(totalDays/7)).toFixed(1);
  const thisWeek=wkEntries[wkEntries.length-1]?.[1]||0;
  const streak=calcStreak(logs);

  c.innerHTML=`
  <div class="summary-grid" style="margin-bottom:14px">
    <div class="sum-card"><div class="sum-val">${totalTrained}</div><div class="sum-lbl">Total Treinos</div></div>
    <div class="sum-card"><div class="sum-val">${streak}</div><div class="sum-lbl">Dias Seguidos</div></div>
    <div class="sum-card"><div class="sum-val">${avgWeek}x</div><div class="sum-lbl">Média/Semana</div></div>
    <div class="sum-card"><div class="sum-val">${thisWeek}x</div><div class="sum-lbl">Esta Semana</div></div>
  </div>
  <div class="chart-wrap">
    <div style="font-weight:700;font-size:14px;margin-bottom:10px">📅 Treinos por Semana</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">${bars}</svg>
  </div>
  ${buildConsistencyCalendar(logs)}`;
}

function calcStreak(logs){
  if(!logs.length) return 0;
  let streak=0, check=new Date();
  check.setHours(12,0,0,0);
  for(let i=0;i<365;i++){
    const ds=localDateStr(check);
    if(logs.includes(ds)){ streak++; check.setDate(check.getDate()-1); }
    else break;
  }
  return streak;
}

function buildConsistencyCalendar(logs){
  const logSet=new Set(logs);
  const today=new Date(); today.setHours(12,0,0,0);
  const weeks=12;
  let html=`<div class="chart-wrap"><div style="font-weight:700;font-size:14px;margin-bottom:12px">📆 Consistência (últimas ${weeks} semanas)</div><div style="display:flex;gap:4px;flex-wrap:wrap">`;
  for(let w=weeks-1;w>=0;w--){
    html+=`<div style="display:flex;flex-direction:column;gap:3px">`;
    for(let d=0;d<7;d++){
      const dt=new Date(today); dt.setDate(today.getDate()-(w*7+(6-d)));
      const ds=localDateStr(dt);
      const trained=logSet.has(ds);
      const isToday=ds===todayStr();
      html+=`<div title="${ds}" style="width:12px;height:12px;border-radius:2px;background:${trained?'var(--accent)':isToday?'var(--border2)':'var(--border)'};opacity:${dt>today?0.2:1}"></div>`;
    }
    html+=`</div>`;
  }
  html+=`</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div style="width:10px;height:10px;border-radius:2px;background:var(--border)"></div><span style="font-size:10px;color:var(--text3)">Sem treino</span><div style="width:10px;height:10px;border-radius:2px;background:var(--accent)"></div><span style="font-size:10px;color:var(--text3)">Treino concluído</span></div></div>`;
  return html;
}

function renderEvolMedidas(){
  const c=document.getElementById('evolContent'); if(!c) return;
  const measures=S.measures||[];
  const lastMeasure=measures[measures.length-1]||{};
  const prevMeasure=measures[measures.length-2]||{};

  let gridHtml=MEASURE_FIELDS.map(f=>{
    const val=lastMeasure[f.k]||'—';
    const prev=parseFloat(prevMeasure[f.k]||0);
    const curr=parseFloat(lastMeasure[f.k]||0);
    const diff=prev&&curr?(curr-prev).toFixed(1):null;
    const diffColor=diff>0?'var(--red)':diff<0?'var(--accent)':'var(--text3)';
    return `<div class="measure-item">
      <div class="measure-lbl">${f.emoji} ${f.l}</div>
      <div class="measure-val">${val}${val!=='—'?' cm':''}</div>
      ${diff?`<div class="measure-diff" style="color:${diffColor}">${diff>0?'+':''}${diff} cm</div>`:''}
    </div>`;
  }).join('');

  c.innerHTML=`
  <button class="btn btn-accent btn-full" onclick="openAddMeasure()" style="margin-bottom:14px">📏 Registrar Medidas</button>
  ${!measures.length?'<div style="text-align:center;padding:40px;color:var(--text3)">Nenhuma medida registrada ainda</div>':''}
  ${measures.length?`<div class="section-label">Última Medição — ${lastMeasure.date||'—'}</div><div class="measure-grid">${gridHtml}</div>`:''}
  ${measures.length>=2?buildMeasureChart():''}
  ${buildWeightChart()}
  ${measures.length?`<div class="section-label">Histórico de Medições</div>${[...measures].reverse().slice(0,5).map(m=>`<div class="card-sm"><div style="font-weight:600;font-size:13px">${m.date}</div><div style="font-size:11px;color:var(--text3);margin-top:4px">${MEASURE_FIELDS.filter(f=>m[f.k]).map(f=>`${f.l}: ${m[f.k]}cm`).join(' • ')}</div></div>`).join('')}`:''}`;
}

function buildMeasureChart(){
  const measures=(S.measures||[]).slice(-10);
  if(measures.length<2) return '';
  const fields=['peitoral','bracoDireito','barriga'];
  const colors=['var(--accent)','var(--blue)','var(--orange)'];
  const W=300,H=130,PL=34,PR=8,PT=12,PB=24,cw=W-PL-PR,ch=H-PT-PB;
  let paths='', dots='';
  fields.forEach((f,fi)=>{
    const vals=measures.map(m=>parseFloat(m[f])||0).filter(v=>v>0);
    if(vals.length<2) return;
    const mx=Math.max(...vals), mn=Math.min(...vals), rng=mx-mn||1;
    const pts=measures.map((m,i)=>({x:PL+(i/(measures.length-1))*cw, y:PT+(1-(parseFloat(m[f]||0)-mn)/rng)*ch}));
    const pd=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    paths+=`<path d="${pd}" fill="none" stroke="${colors[fi]}" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>`;
    dots+=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${colors[fi]}"/>`).join('');
  });
  const xl=measures.map((m,i)=>{const x=PL+(i/(measures.length-1))*cw;const d=new Date(m.date+'T12:00:00');return `<text x="${x.toFixed(1)}" y="${H-2}" text-anchor="middle" fill="var(--text3)" font-size="7">${d.getDate()}/${d.getMonth()+1}</text>`;}).join('');
  const legend=fields.map((f,fi)=>`<span style="font-size:10px;color:${colors[fi]};margin-right:8px">● ${MEASURE_FIELDS.find(mf=>mf.k===f)?.l}</span>`).join('');
  return `<div class="chart-wrap"><div style="font-weight:700;font-size:14px;margin-bottom:6px">📏 Evolução de Medidas</div><div style="margin-bottom:8px">${legend}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%">${paths}${dots}${xl}</svg></div>`;
}

function buildWeightChart(){
  const wh=S.weightHistory||[];
  if(wh.length<2) return wh.length?'<div class="card-sm" style="margin-bottom:12px;text-align:center;color:var(--text3);font-size:12px">💡 Salve pelo menos 2 pesos em Config para ver o gráfico</div>':'';
  const W=300,H=110,PL=36,PR=8,PT=12,PB=24,cw=W-PL-PR,ch=H-PT-PB;
  const vals=wh.map(h=>parseFloat(h.w)||0);
  const mx=Math.max(...vals), mn=Math.min(...vals), rng=mx-mn||1;
  const pts=wh.map((h,i)=>({x:PL+(wh.length>1?i/(wh.length-1)*cw:cw/2), y:PT+(1-(parseFloat(h.w)-mn)/rng)*ch, ...h}));
  const pd=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const ad=pd+` L${pts[pts.length-1].x.toFixed(1)} ${H-PB} L${pts[0].x.toFixed(1)} ${H-PB} Z`;
  const ticks=[mn,mn+rng/2,mx].map(v=>{const y=PT+(1-(v-mn)/rng)*ch;return `<text x="${PL-3}" y="${(y+3).toFixed(1)}" text-anchor="end" fill="var(--text3)" font-size="8">${v}</text><line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>`;}).join('');
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--blue)"/>`).join('');
  const xl=pts.filter((_,i)=>i===0||i===pts.length-1).map(p=>{const d=new Date(p.d+'T12:00:00');return `<text x="${p.x.toFixed(1)}" y="${H-2}" text-anchor="middle" fill="var(--text3)" font-size="8">${d.getDate()}/${d.getMonth()+1}</text>`;}).join('');
  const last=vals[vals.length-1],first=vals[0],diff=(last-first).toFixed(1);
  const diffC=parseFloat(diff)<0?'var(--accent)':parseFloat(diff)>0?'var(--red)':'var(--text3)';
  return `<div class="chart-wrap"><div style="font-weight:700;font-size:14px;margin-bottom:10px">⚖️ Evolução de Peso</div>
    <div class="row" style="gap:16px;margin-bottom:12px">
      <div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blue)">${last} kg</div><div style="font-size:10px;color:var(--text3)">Atual</div></div>
      <div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:${diffC}">${parseFloat(diff)>0?'+':''}${diff} kg</div><div style="font-size:10px;color:var(--text3)">Variação</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible">${ticks}<path d="${ad}" fill="var(--blue)" opacity="0.07"/><path d="${pd}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>
  </div>`;
}

function openAddMeasure(){

    <div class="input-group" style="margin-bottom:10px">
