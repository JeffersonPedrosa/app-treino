function calcIMC(w,h){const wf=parseFloat(w),hf=parseFloat(h);if(!wf||!hf)return null;return(wf/((hf/100)**2)).toFixed(1);}
function imcInfo(imc){
  if(!imc)return{label:'—',desc:'',color:'var(--text3)',pct:50};
  const v=parseFloat(imc);
  if(v<16)return{label:'Muito Abaixo',desc:'Abaixo do limite',color:'#4da6ff',pct:5};
  if(v<18.5)return{label:'Abaixo do Peso',desc:'Abaixo do ideal',color:'#4da6ff',pct:15};
  if(v<25)return{label:'Peso Normal',desc:'Faixa saudável ✅',color:'var(--accent)',pct:25+((v-18.5)/6.5*35)};
  if(v<30)return{label:'Sobrepeso',desc:'Acima do ideal',color:'var(--orange)',pct:60+((v-25)/5*20)};
  return{label:'Obesidade',desc:'Risco à saúde',color:'var(--red)',pct:80};
}
function liveIMC(){
  const w=document.getElementById('cfgPeso')?.value, h=document.getElementById('cfgAltura')?.value;
  const imc=calcIMC(w,h), card=document.getElementById('imcCard'); if(!card) return;
  if(!imc){card.style.display='none';return;}
  card.style.display='block'; const info=imcInfo(imc);
  document.getElementById('imcVal').textContent=imc; document.getElementById('imcVal').style.color=info.color;
  document.getElementById('imcTag').textContent=info.label; document.getElementById('imcTag').style.cssText=`background:${info.color}22;color:${info.color};font-size:13px`;
  document.getElementById('imcDesc').textContent=info.desc; document.getElementById('imcNeedle').style.left=info.pct+'%';
}
function saveProfile(){
  const newWeight=document.getElementById('cfgPeso').value;
  S.profile={...S.profile,name:document.getElementById('cfgName').value,age:document.getElementById('cfgAge').value,height:document.getElementById('cfgAltura').value,weight:newWeight,goal:document.getElementById('cfgGoal').value};
  if(newWeight){if(!S.weightHistory)S.weightHistory=[];const today=todayStr();const i=S.weightHistory.findIndex(h=>h.d===today);const entry={d:today,w:parseFloat(newWeight)};if(i>=0)S.weightHistory[i]=entry;else S.weightHistory.push(entry);S.weightHistory.sort((a,b)=>a.d.localeCompare(b.d));}
  save(); showToast('✅ Perfil salvo!'); render();
}

function openExerciseDB(grp){
  let selGrp=grp||window._dbGrp||'peito';
  window._dbGrp=selGrp;
  const renderDB=()=>{
    const exs=Object.entries(S.exerciseDB).filter(([,e])=>e.group===selGrp).sort((a,b)=>a[1].name.localeCompare(b[1].name));
    const body=document.getElementById('modalBody'); if(!body) return;
    const active=exs.filter(([,e])=>e.active), inactive=exs.filter(([,e])=>!e.active);
    let html=`<div class="tgl-group" style="flex-wrap:wrap">${GROUP_ORDER.map(g=>`<button class="tgl-btn${selGrp===g?' active':''}" onclick="window._dbg('${g}')">${GROUP_LABELS[g]}</button>`).join('')}</div>
      <button class="btn btn-accent btn-full" style="margin-bottom:12px" onclick="openNewExercise('${selGrp}')">+ Novo exercício em ${GROUP_LABELS[selGrp]}</button>`;
    const renderGrp=(list,lbl)=>{
      if(!list.length) return '';
      return `<div class="section-label">${lbl}</div>`+list.map(([id,ex])=>`<div class="list-item${ex.active?'':' inactive'}"><div class="li-info"><div class="li-name">${ex.name}${ex.custom?' <span class="tag tag-purple" style="margin-left:4px">Meu</span>':''}</div><div class="li-sub">${ex.muscle||''}</div></div><label class="switch" onclick="event.stopPropagation()"><input type="checkbox" ${ex.active?'checked':''} onchange="S.exerciseDB['${id}'].active=this.checked;save();"><div class="switch-track"></div></label></div>`).join('');
    };
    html+=renderGrp(active,'Ativos')+renderGrp(inactive,'Inativos');
    body.innerHTML=html;
  };
  window._dbg=(g)=>{selGrp=g;window._dbGrp=g;renderDB();};
  showModal('🏋️ Exercícios','',[{label:'Fechar',cls:'btn-ghost',fn:closeModal}]);
  renderDB();
}

function openNewExercise(grp){
  showModal(`+ Novo — ${GROUP_LABELS[grp]}`,`
    <div class="input-group"><div class="input-label">Nome do exercício</div><input class="input" id="neName" placeholder="Ex: Supino Máquina" autocomplete="off"></div>
    <div class="input-group"><div class="input-label">Músculo / observação (opcional)</div><input class="input" id="neMuscle" placeholder="Ex: Peitoral maior" autocomplete="off"></div>`,
    [{label:'💾 Salvar',cls:'btn-accent',fn:()=>{
      const name=document.getElementById('neName').value.replace(/[<>]/g,'').trim();
      const muscle=document.getElementById('neMuscle').value.replace(/[<>]/g,'').trim();
      if(!name){showToast('⚠️ Digite o nome');return;}
      if(Object.values(S.exerciseDB).some(e=>e.group===grp&&e.name.toLowerCase()===name.toLowerCase())){showToast('⚠️ Esse exercício já existe');return;}
      const id='custom_'+Date.now().toString(36);

function exportExcel(){
  try{
    const wb=XLSX.utils.book_new(), ds=todayStr();
    const p=S.profile, imc=calcIMC(p.weight,p.height);
    const wsPerfil=XLSX.utils.aoa_to_sheet([['PERFIL'],['Nome',p.name||'—'],['Idade',p.age||'—'],['Peso',p.weight||'—'],['Altura',p.height||'—'],['IMC',imc||'—'],['Objetivo',p.goal||'—']]);
    wsPerfil['!cols']=[{wch:20},{wch:30}]; XLSX.utils.book_append_sheet(wb,wsPerfil,'Perfil');
    const plan=getActivePlan();
    if(plan){
      const rows=[['PLANO','DIA','EXERCÍCIO','GRUPO','SÉRIES','REPS','CARGA']];
      Object.entries(plan.days||{}).forEach(([dow,exs])=>{ (exs||[]).forEach(item=>{const ex=exDB(item.exId);rows.push([plan.name,DAYS_FULL[dow],ex.name,GROUP_LABELS[ex.group]||ex.group,item.sets,item.reps,item.weight||'']);});});
      const ws=XLSX.utils.aoa_to_sheet(rows); XLSX.utils.book_append_sheet(wb,ws,'Plano Ativo');
    }
    const histRows=[['EXERCÍCIO','DATA','CARGA','SÉRIES','REPS']];
    Object.entries(S.history).forEach(([id,entries])=>{const ex=exDB(id);(entries||[]).forEach(e=>{histRows.push([ex.name,e.date,e.weight,e.sets,e.reps]);});});
    const wsH=XLSX.utils.aoa_to_sheet(histRows); XLSX.utils.book_append_sheet(wb,wsH,'Histórico de Cargas');
    const logRows=[['DATA','CONCLUÍDO','TEMPO(min)','OUTROS EXERCÍCIOS']];
    Object.entries(S.dailyLogs).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,log])=>{ logRows.push([date,log.trained?'Sim':'Não',log.totalTime||'',getOthers(log).map(o=>o.a+(o.t?' '+o.t+'min':'')).join(' | ')]);});
    const wsL=XLSX.utils.aoa_to_sheet(logRows); XLSX.utils.book_append_sheet(wb,wsL,'Diário');
    if(S.measures&&S.measures.length){
      const mRows=[['DATA',...MEASURE_FIELDS.map(f=>f.l)]];
      S.measures.forEach(m=>{ mRows.push([m.date,...MEASURE_FIELDS.map(f=>m[f.k]||'')]);});
      const wsM=XLSX.utils.aoa_to_sheet(mRows); XLSX.utils.book_append_sheet(wb,wsM,'Medidas');
    }
    XLSX.writeFile(wb,`treino-relatorio-${ds}.xlsx`); showToast('📊 Excel exportado!');
  }catch(e){console.error(e);showToast('❌ Erro ao gerar Excel.');}
}

function handleImportFile(inp){
  const file=inp.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.profile&&!data.plans){showToast('❌ Arquivo inválido');return;}
      showModal('📤 Importar',`<div style="text-align:center;padding:20px 0"><div style="font-size:48px;margin-bottom:12px">📤</div><div style="font-size:15px;font-weight:700">Substituir dados atuais?</div></div>`,
        [{label:'Sim, importar',cls:'btn-accent',fn:()=>{S={...defaultState(),...data};save();closeModal();render();showToast('✅ Dados importados!');}},{label:'Cancelar',cls:'btn-ghost',fn:closeModal}]);
    }catch{showToast('❌ Erro ao ler arquivo.');}
  };
  reader.readAsText(file); inp.value='';
}

function handlePhotoFile(inp){
  const file=inp.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'); const MAX=300; let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h/w*MAX;w=MAX;}}else{if(h>MAX){w=w/h*MAX;h=MAX;}}
      canvas.width=w;canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
      S.profile.photo=canvas.toDataURL('image/jpeg',0.8); save();
      if(db&&currentUser) db.collection('users').doc(currentUser.uid).collection('data').doc('photo').set({photo:S.profile.photo}).catch(()=>{});
      showToast('✅ Foto atualizada!'); render();
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file); inp.value='';
}

  const articles=[
    {icon:'⚡',title:'Técnicas Avançadas de Treino',sub:'UP SET, DROP SET, REST PAUSE, RIS',body:buildTechArticle()},
    {icon:'💧',title:'Hidratação e Performance',sub:'Por que a água é seu melhor suplemento',body:`<p>A desidratação de apenas <strong>2%</strong> do peso corporal já compromete a performance em até <strong>20%</strong>. Seus músculos são compostos por ~75% de água.</p><h4>Recomendações</h4><ul><li>500ml a 1L por hora de treino intenso</li><li>Beba antes de sentir sede — a sede já é sinal de desidratação</li><li>Urina amarela clara = hidratado; escura = beba mais</li><li>Água de coco e isotônicos ajudam em treinos acima de 60 min</li></ul><h4>Sinais de Desidratação</h4><ul><li>Fadiga precoce e queda de força</li><li>Câimbras musculares</li><li>Tontura e dor de cabeça</li><li>Concentração reduzida</li></ul>`},
    {icon:'😴',title:'Descanso e Recuperação',sub:'O treino acontece fora da academia',body:`<p>O crescimento muscular ocorre durante o <strong>descanso</strong>, não durante o treino. O treino é o estímulo — o sono é onde a mágica acontece.</p><h4>O que acontece durante o sono</h4><ul><li>Liberação do GH (hormônio do crescimento) — pico nas primeiras horas</li><li>Síntese proteica muscular</li><li>Reposição de glicogênio</li><li>Recuperação do sistema nervoso central</li></ul><h4>Recomendações</h4><ul><li>7-9 horas por noite</li><li>Evite treinos intensos 3h antes de dormir</li><li>Grupos musculares grandes precisam de 48-72h de descanso</li><li>Overtraining = queda de performance + risco de lesão</li></ul>`},
    {icon:'🥩',title:'Nutrição para Hipertrofia',sub:'Coma para crescer',body:`<p>Sem <strong>superávit calórico</strong> e proteína suficiente, o treino não resulta em crescimento muscular.</p><h4>Proteína</h4><ul><li>Meta: <strong>1.6 a 2.2g por kg de peso</li><li>Fontes: frango, peixe, ovos, carne magra, whey, tofu</li><li>Distribua ao longo do dia — máximo ~40g absorvido por refeição</li></ul><h4>Carboidratos</h4><ul><li>Principal combustível do treino de força</li><li>Consuma 1-2h antes do treino: arroz, batata, aveia</li><li>Pós-treino: repõe glicogênio muscular</li></ul><h4>Gorduras saudáveis</h4><ul><li>Essenciais para produção de testosterona</li><li>Azeite, abacate, castanhas, salmão</li></ul>`},
    {icon:'🧠',title:'Conexão Mente-Músculo',sub:'Concentração muda resultados',body:`<p>Focar conscientemente no músculo que está trabalhando aumenta a ativação muscular em <strong>20-60%</strong> em alguns estudos.</p><h4>Como praticar</h4><ul><li>Reduza o peso e foque na contração</li><li>Faça a fase excêntrica (descida) lenta — 3 a 4 segundos</li><li>Evite movimentos bruscos por impulso</li><li>Visualize o músculo contraindo antes de executar</li></ul><h4>Dica prática</h4><p>Toque levemente o músculo alvo antes de executar o exercício. O feedback tátil ajuda a ativar a conexão mente-músculo.</p>`},
    {icon:'🏃',title:'Cardio Inteligente',sub:'Quando, como e quanto fazer',body:`<p>O cardio não precisa "comer" seu músculo. Feito da forma certa, potencializa resultados.</p><h4>Tipos de cardio</h4><ul><li><strong>LISS (baixa intensidade):</strong> caminhada, bicicleta leve — 30-60 min — ideal para recuperação ativa</li><li><strong>MISS (intensidade moderada):</strong> corrida contínua — 20-40 min — equilíbrio entre gasto calórico e esforço</li><li><strong>HIIT (alta intensidade):</strong> sprints, tabata — 15-20 min — máximo gasto calórico em menos tempo</li></ul><h4>Quando fazer</h4><ul><li>Prefira cardio APÓS o treino de força — ou em dias separados</li><li>LISS em jejum pode ser estratégico para emagrecimento</li><li>HIIT não mais que 2-3x por semana</li></ul>`},
    {icon:'📏',title:'Periodização de Treino',sub:'Progresso planejado = resultados duradouros',body:`<p><strong>Periodização</strong> é a variação sistemática de volume e intensidade ao longo do tempo para evitar platôs e lesões.</p><h4>Tipos</h4><ul><li><strong>Linear:</strong> aumento gradual de carga a cada semana. Ideal para iniciantes.</li><li><strong>Ondulatória:</strong> variação de volume/intensidade dentro da semana. Exemplo: segunda pesada, quarta moderada, sexta leve.</li><li><strong>Em blocos:</strong> fases de 4-6 semanas com foco específico — volume → força → potência.</li></ul><h4>Regra prática</h4><ul><li>Mude o treino a cada 6-12 semanas</li><li>Semana de descarga a cada 4-6 semanas (volume reduzido)</li><li>Registre tudo — sem dados não há progressão inteligente</li></ul>`},
    {icon:'🛡️',title:'Prevenção de Lesões',sub:'O melhor treino é o que você pode manter',body:`<p>Lesões custam semanas ou meses de progresso. Prevenir é sempre melhor que tratar.</p><h4>Principais causas de lesão</h4><ul><li>Aumento de carga muito rápido (regra dos 10%: nunca aumente mais de 10% por semana)</li><li>Técnica de execução inadequada</li><li>Falta de aquecimento</li><li>Overtraining — descanso insuficiente</li></ul><h4>Estratégias</h4><ul><li>Sempre aqueça: 5-10 min de mobilidade + séries leves do exercício</li><li>Aprenda a execução antes de aumentar carga</li><li>Dor articular ≠ dor muscular — pare se sentir nas articulações</li><li>Inclua exercícios de mobilidade e fortalecimento de estabilizadores</li></ul>`},
    {icon:'💊',title:'Suplementação Básica',sub:'O que realmente funciona',body:`<p>Suplementos <strong>complementam</strong> a dieta — nunca substituem. A maioria das pessoas não precisa de mais do que o básico.</p><h4>Comprovados cientificamente</h4><ul><li><strong>Creatina:</strong> 3-5g/dia — aumenta força, potência e volume muscular. O suplemento mais estudado do mundo.</li><li><strong>Whey Protein:</strong> prático para atingir a meta proteica. Não é "bomba" — é proteína do leite.</li><li><strong>Cafeína:</strong> 3-6mg/kg 30-60 min antes — melhora foco, força e resistência.</li><li><strong>Vitamina D:</strong> fundamental para testosterona e recuperação — a maioria das pessoas tem deficiência.</li></ul><h4>Frequentemente superestimados</h4><ul><li>BCAA (se já come proteína suficiente, inútil)</li><li>Pré-treinos complexos (a cafeína já faz 90% do trabalho)</li><li>Queimadores de gordura</li></ul>`},
  ];

  let html='';
  articles.forEach((art,i)=>{
    html+=`<div class="article-card">
      <div class="article-header" onclick="toggleArticle(${i})">
        <span class="article-icon">${art.icon}</span>
        <div><div class="article-title">${art.title}</div><div class="article-sub">${art.sub}</div></div>
        <span id="artArrow_${i}" style="color:var(--text3);font-size:18px;flex-shrink:0">›</span>
      </div>
      <div class="article-body" id="artBody_${i}">${art.body}</div>
    </div>`;
  });
  c.innerHTML=html;
}

function toggleArticle(i){
  const body=document.getElementById('artBody_'+i), arrow=document.getElementById('artArrow_'+i);
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(arrow) arrow.textContent=isOpen?'›':'⌄';
}

function buildTechArticle(){
  return `
  <h4>⚡ RIS — 30/20/10/20/30</h4>
  <p>Uma das técnicas mais brutais do arsenal do fisiculturismo. Cinco fases consecutivas com alteração de carga, sem descanso entre elas.</p>
  <ul>
    <li>🟢 <strong>30 reps</strong> → carga leve → até a falha</li>
    <li>⬆️ Aumenta o peso</li>
    <li>🟡 <strong>20 reps</strong> → carga moderada → até a falha</li>
    <li>⬆️ Aumenta o peso</li>
    <li>🔴 <strong>10 reps</strong> → carga pesada → até a falha</li>
    <li>⬇️ Reduz o peso</li>
    <li>🟡 <strong>20 reps</strong> → até a falha</li>
    <li>⬇️ Reduz novamente</li>
    <li>🟢 <strong>30 reps</strong> → até a falha total</li>
  </ul>
  <p><strong>Resultado:</strong> congestão extrema, esgotamento total das fibras, combinação de pirâmide + drop set + alto volume metabólico. Indicado para o <em>final</em> do treino. Popular em pernas, ombros e braços.</p>

  <h4>📉 DROP SET</h4>
  <p>Método clássico que estende a série além da falha, reduzindo o peso sem descanso. Recruta fibras adicionais que não foram ativadas com a carga original.</p>
  <ul>
    <li>Vai até a falha com carga X</li>
    <li>Sem parar, reduz 20-30% do peso</li>
    <li>Nova falha com carga menor</li>
    <li>Pode repetir 2-3 vezes (duplo/triplo drop)</li>
  </ul>
  <p><strong>Exemplo:</strong> Rosca direta: 20kg → falha → 15kg → falha → 10kg → falha.<br>
  Sensação forte de queima, altíssimo estresse metabólico. Use na <em>última série</em> de um exercício.</p>

  <h4>⏸ REST PAUSE</h4>
  <p>Maximiza o volume de trabalho com carga alta através de micro-pausas estratégicas. Muito mais intenso do que parece.</p>
  <ul>
    <li>Vai até a falha com carga alta</li>
    <li>Respira fundo por <strong>10-20 segundos</strong></li>
    <li>Faz mais repetições com o mesmo peso</li>
    <li>Repete 2-3 vezes</li>
  </ul>
  <p><strong>Exemplo:</strong> Supino: 10 reps até falha → descansa 15s → 3 reps → 15s → 2 reps.<br>
  Extremamente eficiente em máquinas e exercícios seguros. Gera mais volume com carga máxima.</p>

  <h4>📈 UP SET</h4>
  <p>Progressão crescente de carga entre séries, preparando o sistema neuromuscular para atingir desempenho máximo na série final.</p>
  <ul>
    <li>Série 1: carga leve → 15 reps</li>
    <li>Série 2: carga moderada → 12 reps</li>
    <li>Série 3: carga pesada → 10 reps</li>
    <li>Série 4: carga máxima → 8 reps</li>
  </ul>
  <p>Mais controlado e seguro. Ideal para exercícios compostos (agachamento, supino, terra). Excelente para quem quer melhorar força.</p>

  <table class="tech-compare">
    <thead><tr><th>Técnica</th><th>Foco</th><th>Intensidade</th><th>Descanso</th></tr></thead>
    <tbody>
      <tr><td style="color:var(--pink)"><strong>RIS</strong></td><td>Exaustão total</td><td>🔥🔥🔥🔥🔥</td><td>Nenhum</td></tr>
      <tr><td style="color:var(--blue)"><strong>Rest Pause</strong></td><td>Força + hiper</td><td>🔥🔥🔥🔥</td><td>10-20s</td></tr>
      <tr><td style="color:var(--orange)"><strong>Drop Set</strong></td><td>Hipertrofia</td><td>🔥🔥🔥</td><td>Sem parar</td></tr>
      <tr><td style="color:var(--teal)"><strong>Up Set</strong></td><td>Progressão</td><td>🔥🔥</td><td>Normal</td></tr>
    </tbody>
  </table>
  <p style="margin-top:12px;font-size:12px;color:var(--text3)">⚠️ Use no máximo 1-2 técnicas avançadas por treino, preferencialmente na última série. Exercícios com máquinas e cabos são mais seguros para uso dessas técnicas do que movimentos livres pesados.</p>`;
}

function showModal(title,bodyHTML,buttons){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  const f=document.getElementById('modalFooter'); f.innerHTML='';
  (buttons||[]).forEach(b=>{const btn=document.createElement('button');btn.className='btn '+b.cls+' btn-full';btn.textContent=b.label;btn.onclick=b.fn;f.appendChild(btn);});
  document.getElementById('overlay').classList.add('show');
  requestAnimationFrame(()=>document.getElementById('modal').classList.add('show'));
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  closeOverlay2();
}
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;white-space:nowrap;border:1px solid #333;box-shadow:0 4px 20px rgba(0,0,0,.5)';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
